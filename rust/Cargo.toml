[package]
name = "ffi_test"
version = "0.1.0"
authors = ["Nick Spagnola <nicholas.a.spagnola@gmail.com>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]

[lib]
name = "ffi_test"
path = "src/lib.rs"
# cdylib, not dylib: dylib exports Rust's unstable ABI for other Rust crates,
# cdylib is the C-ABI shared library a non-Rust caller links against.
# staticlib is the same C ABI as an archive, linked into a NativeAOT executable.
crate-type = ["cdylib", "staticlib"]

[[bin]]
name = "ffi_test_bin"
path = "src/main.rs"
