[package]
name = "ffi_test"
version = "0.1.0"
authors = ["Nick Spagnola <nicholas.a.spagnola@gmail.com>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
libc = "*"

[lib]
name = "_ffi_test"
path = "src/lib.rs"
crate-type = ["dylib"]

[[bin]]
name = "ffi_test_bin"
path = "src/main.rs"